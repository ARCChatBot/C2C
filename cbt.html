<div class="bg-white rounded-3xl max-w-md w-full p-8 shadow-2xl border border-slate-100 text-center space-y-6">
    <div class="w-16 h-16 rounded-2xl bg-blue-50 text-brandBlue flex items-center justify-center text-3xl mx-auto shadow-inner border border-blue-100">
        <i class="fa-solid fa-user-graduate"></i>
    </div>
    <div>
        <h2 class="text-2xl font-extrabold text-slate-900 tracking-tight">Operation SEMI Intake</h2>
        <p class="text-xs text-slate-500 mt-1">Enter your credentials to register your profile in the C2C database.</p>
    </div>
    <form id="directIntakeForm" class="space-y-3 pt-2" onsubmit="handleDirectIntake(event)">
        <input type="text" id="intakeStudentId" placeholder="Student ID (e.g. VSU-100294)" required class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-brandBlue bg-slate-50">
        <input type="text" id="intakeFullName" placeholder="Full Name (e.g. Nicolas Pollard)" required class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-brandBlue bg-slate-50">
        <button type="submit" class="w-full py-3.5 px-4 rounded-xl bg-brandBlue hover:bg-blue-700 text-white font-semibold text-sm transition-colors shadow-lg shadow-blue-500/20 flex items-center justify-center gap-2">
            <i class="fa-solid fa-floppy-disk"></i> Register to Database
        </button>
    </form>
</div>

<script>
async function handleDirectIntake(event) {
    event.preventDefault();
    const studentId = document.getElementById('intakeStudentId').value.trim();
    const fullName = document.getElementById('intakeFullName').value.trim();

    try {
        const response = await fetch('https://c2c-5y77.onrender.com/api/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ student_id: studentId, full_name: fullName })
        });

        const data = await response.json();
        if (response.ok) {
            alert('Success! Student registered in the SQLite database.');
            window.location.href = 'cbt.html'; // Route to training module
        } else {
            alert('Registration error: ' + (data.detail || 'Unknown error'));
        }
    } catch (error) {
        console.error('Connection error:', error);
        alert('Could not connect to the Render backend.');
    }
}
</script>
