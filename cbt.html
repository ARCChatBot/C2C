<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operation SEMI - C2C Student Intake</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="h-full bg-slate-50 text-slate-800 font-sans antialiased flex flex-col justify-center items-center p-4">

    <div class="bg-white rounded-3xl max-w-md w-full p-8 shadow-2xl border border-slate-100 text-center space-y-6">
        <div class="w-16 h-16 rounded-2xl bg-blue-50 text-blue-600 flex items-center justify-center text-3xl mx-auto shadow-inner border border-blue-100">
            <i class="fa-solid fa-user-graduate"></i>
        </div>
        <div>
            <h2 class="text-2xl font-extrabold text-slate-900 tracking-tight">Operation SEMI Intake</h2>
            <p class="text-xs text-slate-500 mt-1">Enter your credentials to register your profile in the C2C SQLite database under NSF Award #2606117.</p>
        </div>
        
        <form id="directIntakeForm" class="space-y-4 pt-2 text-left" onsubmit="handleDirectIntake(event)">
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Student ID</label>
                <input type="text" id="intakeStudentId" placeholder="e.g. VSU-100294" required class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-blue-600 bg-slate-50">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Full Name</label>
                <input type="text" id="intakeFullName" placeholder="e.g. Nicolas Pollard" required class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-blue-600 bg-slate-50">
            </div>
            <button type="submit" class="w-full py-3.5 px-4 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-semibold text-sm transition-colors shadow-lg shadow-blue-500/20 flex items-center justify-center gap-2">
                <i class="fa-solid fa-floppy-disk"></i> Register to Database
            </button>
        </form>
    </div>

    <footer class="mt-8 text-xs text-slate-400">
        Classroom to Cleanroom (C2C) Pathway &bull; Virginia State University
    </footer>

    <script>
    async function handleDirectIntake(event) {
        event.preventDefault();
        const studentId = document.getElementById('intakeStudentId').value.trim();
        const fullName = document.getElementById('intakeFullName').value.trim();

        try {
            const response = await fetch('https://c2c-5y77.onrender.com/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ student_id: studentId, full_name: fullName })
            });

            const data = await response.json();
            if (response.ok) {
                alert('Success! Student successfully registered in the SQLite database.');
                // Optional: Redirect or unlock next modules here
            } else {
                alert('Registration error: ' + (data.detail || 'Unknown error'));
            }
        } catch (error) {
            console.error('Connection error:', error);
            alert('Could not connect to the Render backend server.');
        }
    }
    </script>
</body>
</html>
